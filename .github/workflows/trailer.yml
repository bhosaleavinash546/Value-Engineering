name: Make course trailers
# Builds videos/trailer-academy.mp4 and videos/trailer-leaders.mp4 (with posters and captions)
# from tools/trailer: scenes drawn by tools/trailer/stage.html, short clips from the course
# videos, a voice-over by a Microsoft neural voice (en-GB-RyanNeural) and sound effects made
# with ffmpeg, and music written by tools/trailer/music.py. Run it by hand after changing tools/trailer.
on:
  workflow_dispatch:
    inputs:
      courses:
        description: 'Which trailers: "academy", "leaders" or both'
        required: false
        default: "academy leaders"

permissions:
  contents: write
  actions: write   # to start the deploy and site checks after committing

concurrency:
  group: trailer
  cancel-in-progress: false

jobs:
  trailer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright, ffmpeg and the voice
        run: |
          cd tests && npm ci && npx playwright install --with-deps chromium
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install edge-tts numpy

      - name: Make the trailers
        env:
          VOICE: "1"
        run: node tools/trailer/make.js ${{ inputs.courses }}

      - name: Commit the trailers
        run: |
          git config user.name "vavehub-trailer"
          git config user.email "actions@users.noreply.github.com"
          git add videos/trailer-*
          git commit -m "Update the course trailers" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done

      - name: Publish and re-run the site checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main
          gh workflow run tests.yml --ref main
