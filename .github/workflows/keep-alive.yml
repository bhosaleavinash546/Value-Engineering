name: Keep Supabase awake
# Supabase pauses free projects after 7 days without activity, which breaks sign-in
# ("Failed to fetch"). Every 3 days this makes one small read from the database:
# the same public lookup the certificate check on verify.html does.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read one row from Supabase
        run: |
          URL=$(grep -o 'supabaseUrl: "[^"]*"' site-config.js | cut -d'"' -f2)
          KEY=$(grep -o 'supabaseAnonKey: "[^"]*"' site-config.js | cut -d'"' -f2)
          [ -n "$URL" ] && [ -n "$KEY" ] || { echo "::error::Supabase address or key missing from site-config.js"; exit 1; }
          for i in 1 2 3; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -m 30 "$URL/rest/v1/certificates?select=id&limit=1" -H "apikey: $KEY" || echo 000)
            echo "Attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Supabase did not answer (HTTP $CODE). The project may be paused: open supabase.com/dashboard and click Restore project."
          exit 1
