name: Site checks
# Runs on every push and pull request: rebuilds the pages from src/ (and fails if the
# committed HTML is out of date), then runs the browser checks in tests/.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated pages match src/
        run: |
          python3 tools/build.py
          git diff --exit-code || { echo "::error::Generated HTML is out of date. Run 'python3 tools/build.py' and commit the result (edit files in src/, not the generated pages)."; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      # Keep the downloaded test browser between runs; it only changes when the
      # Playwright version in tests/package-lock.json changes.
      - name: Cache the test browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
      - name: Install test tools
        working-directory: tests
        run: npm ci
      - name: Install the test browser (first run after a Playwright update)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Install the test browser's system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: tests
        run: npx playwright install-deps chromium
      - name: Run site checks
        working-directory: tests
        run: node run.js
