name: Live check
# Run by hand (Actions → Live check → Run workflow) to confirm the live site and its
# Supabase database work together: the exam and certificate functions exist and the
# public pages load. It reads nothing private and changes nothing.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Supabase functions and live pages
        run: |
          set -u
          URL=$(grep -o 'supabaseUrl: *"[^"]*"' site-config.js | sed 's/.*"\(.*\)"/\1/' | sed 's#/rest/v1/*$##; s#/*$##')
          KEY=$(grep -o 'supabaseAnonKey: *"[^"]*"' site-config.js | sed 's/.*"\(.*\)"/\1/')
          fail=0
          call() { curl -s -X POST "$URL/rest/v1/rpc/$1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d "$2"; }
          n=$(call certificate_count '{}')
          if echo "$n" | grep -Eq '^[0-9]+$'; then echo "✓ certificate_count works ($n certificates)"; else echo "✗ certificate_count: $n"; fail=1; fi
          v=$(call verify_certificate '{"cert_id":"VH-NOTREAL"}')
          if [ "$v" = "[]" ]; then echo "✓ verify_certificate works"; else echo "✗ verify_certificate: $v"; fail=1; fi
          for fn in start_exam submit_exam issue_certificate admin_question_stats; do
            r=$(call $fn '{}')
            if echo "$r" | grep -q 'PGRST202'; then echo "✗ $fn is missing: run the Step B SQL"; fail=1; else echo "✓ $fn exists (visitors without an account are refused, as expected)"; fi
          done
          l=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$URL/rest/v1/certificates?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          body=$(curl -s "$URL/rest/v1/certificates?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          if [ "$body" = "[]" ]; then echo "✓ the certificate list is private"; else echo "✗ certificate list readable: $body"; fail=1; fi
          for page in "" training.html leaders.html verify.html; do
            c=$(curl -s -o /dev/null -w "%{http_code}" "https://valueengineeringhub.com/$page")
            if [ "$c" = "200" ]; then echo "✓ /$page loads"; else echo "✗ /$page returned $c"; fail=1; fi
          done
          if curl -s https://valueengineeringhub.com/training.js | grep -q 'const BANK = \['; then echo "✗ old exam answers still on the live site"; fail=1; else echo "✓ no exam answers in the live page"; fi
          exit $fail
