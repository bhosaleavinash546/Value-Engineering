name: Make case study videos
# Builds the projector case-study videos (videos/cs-*.mp4 and posters) from tools/casevid: scenes drawn
# by tools/casevid/stage.html with the real 3D model, a voice-over by a Microsoft neural voice
# (en-GB-RyanNeural) and music written by tools/trailer/music.py. Each video renders in its own job.
# By default the videos are only uploaded as a run artifact for review; set publish to "yes" to commit them.
on:
  workflow_dispatch:
    inputs:
      videos:
        description: 'Which videos (JSON list): ["intro","p1","p2","p3","p4","p5","p6","learnt"]'
        required: false
        default: '["intro","p1","p2","p3","p4","p5","p6","learnt"]'
      publish:
        description: 'Commit the videos to the site: "yes" or "no"'
        required: false
        default: "no"

permissions:
  contents: write
  actions: write

concurrency:
  group: casevid
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        video: ${{ fromJSON(inputs.videos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright, ffmpeg and the voice
        run: |
          cd tests && npm ci && npx playwright install --with-deps chromium
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install edge-tts numpy
      - name: Make the video
        env:
          VOICE: "1"
          CASEVID_OUT: ${{ github.workspace }}/out
        run: node tools/casevid/make.js ${{ matrix.video }}
      - uses: actions/upload-artifact@v4
        with:
          name: cs-${{ matrix.video }}
          path: out/
          retention-days: 14

  publish:
    needs: render
    if: ${{ inputs.publish == 'yes' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
          pattern: cs-*
          merge-multiple: true
      - name: Commit the videos
        run: |
          cp art/cs-* videos/
          git config user.name "vavehub-casevid"
          git config user.email "actions@users.noreply.github.com"
          git add videos/cs-*
          git commit -m "Update the case study videos" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
      - name: Publish and re-run the site checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main
          gh workflow run tests.yml --ref main
