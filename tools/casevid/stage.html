<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<title>Case study video stage</title>
<!-- Draws one scene of a projector case-study video at a time for tools/casevid/make.js, which calls
     window.setup(scene, meta) once per scene and window.frame(t) for every video frame (t in seconds).
     Everything is a pure function of t, so a frame always looks the same. 3D scenes use the real
     model from projector-3d.js in capture mode; the other scenes are drawn in HTML. -->
<link rel="stylesheet" href="../../fonts/fonts.css" />
<link rel="stylesheet" href="../../style.css" />
<link rel="stylesheet" href="../../case-study.css" />
<style>
  :root{--ink:#eef3ff;--mut:#93a3c4;--blue:#4d8dff;--blue2:#2e6fe8;--green:#3fd08a;--amber:#f5b942;--orange:#ff7a3d;--red:#ff5d5d;--ln:rgba(255,255,255,.13);--panel:#0b1224}
  *{box-sizing:border-box}
  html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:#060a16;color:var(--ink);font-family:'Inter',sans-serif}
  body{cursor:none}
  /* the 3D viewer, full height, from the case study page */
  #pjViewer{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;border-radius:0;background:#060a16}
  #pjViewer .pj-tools,#pjViewer .pj-side,#pjViewer .pj-hint,#pjViewer .pj-card,#pjViewer .pj-fallback,#pjViewer .pj-tip{display:none!important}
  #pjViewer .pj-body{display:block;height:100%}
  #pjViewer .pj-stage{height:1080px;background:radial-gradient(70% 70% at 45% 42%,#18243f 0%,#0a1020 58%,#05080f 100%)}
  .pj-balloon{transition:none!important;margin:-20px 0 0 -20px}
  .pj-balloon span{min-width:40px;height:40px;font-size:19px;box-shadow:0 3px 10px rgba(0,0,0,.4),0 0 0 3px rgba(255,255,255,.9)}
  .pj-balloon em{font-size:22px;padding:4px 12px;border-radius:9px;max-width:420px}
  .pj-leaders line{stroke-width:2}
  /* layers */
  #card{position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 35%,#13203d 0%,#080d1b 62%,#04070e 100%);display:none}
  #card.on{display:block}
  #panel{position:absolute;right:70px;top:190px;width:600px;padding:40px 44px;border-radius:26px;border:2px solid var(--ln);background:rgba(8,13,27,.88);box-shadow:0 40px 90px rgba(0,0,0,.5);display:none}
  #panel.on{display:block}
  #panel small{display:block;font:600 22px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:18px}
  #panel .big{font:700 92px 'IBM Plex Sans',sans-serif;letter-spacing:-.02em;line-height:1;color:#fff}
  #panel .big em{font-style:normal;color:var(--blue)}
  #panel p{font-size:28px;line-height:1.4;color:var(--mut);margin:16px 0 0}

  #panel li b{font-family:'IBM Plex Mono',monospace;color:#fff;font-weight:600}
  #tag{position:absolute;left:58px;top:150px;padding:14px 28px;border-radius:16px;background:rgba(6,10,22,.82);border:2px solid rgba(255,255,255,.12);font:700 40px 'IBM Plex Sans',sans-serif;color:#fff;opacity:0}

  #chip{position:absolute;left:58px;top:46px;padding:8px 22px 8px 10px;border-radius:999px;background:rgba(6,10,22,.82);display:flex;align-items:center;gap:18px;font:600 24px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}

  #brand{position:absolute;right:58px;top:50px;padding:10px 22px;border-radius:999px;background:rgba(6,10,22,.82);font:700 28px 'IBM Plex Sans',sans-serif;color:#fff;opacity:.85}
  #brand span{color:var(--blue)}
  #cap{position:absolute;left:0;right:0;bottom:46px;display:flex;justify-content:center;pointer-events:none}

  #cap:empty{display:none}
  /* card scenes */
  .k{position:absolute;left:120px;right:120px;top:170px;bottom:190px}
  .kt{font:600 24px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:0 0 14px}
  .kh{font:700 58px 'IBM Plex Sans',sans-serif;letter-spacing:-.02em;margin:0 0 30px;line-height:1.1}
  .row{display:flex;gap:28px}
  .box{border:2px solid var(--ln);border-radius:22px;background:var(--panel);padding:30px 34px}
  .mono{font-family:'IBM Plex Mono',monospace}
  .num{font-family:'IBM Plex Mono',monospace;font-weight:600}
  /* title */
  .tt{position:absolute;left:160px;right:160px;top:230px}

  .tt h1{font:800 120px 'IBM Plex Sans',sans-serif;letter-spacing:-.035em;line-height:1.02;margin:18px 0 26px}
  .tt p{font-size:40px;line-height:1.4;color:var(--mut);max-width:1300px;margin:0}
  .jp{position:absolute;left:160px;right:160px;top:640px;display:flex;gap:16px}

  .jp div.on{border-color:var(--blue);color:#fff;background:#10204a}

  .vbars{display:grid;gap:22px}

  /* stacked chain */

  .legend div{display:flex;align-items:center;gap:18px;font-size:32px}
  .legend s{width:26px;height:26px;border-radius:7px;flex:none}
  .legend b{margin-left:auto;font:600 32px 'IBM Plex Mono',monospace}
  .total{margin-top:30px;font:700 56px 'IBM Plex Sans',sans-serif}

  /* table */

  /* lists */
  .list{display:grid;gap:22px;font-size:36px;line-height:1.35}

  .list.warn i{background:var(--amber);color:#1a1205}
  .list b{color:#fff}

  /* grid cards */

  /* big stats */
  .stats{display:flex;gap:40px}
  .st{flex:1;border:2px solid var(--ln);border-radius:24px;background:var(--panel);padding:40px 44px}
  .st .b{font:700 104px 'IBM Plex Sans',sans-serif;letter-spacing:-.02em;line-height:1;white-space:nowrap}
  .stats.n3 .st .b{font-size:86px}
  .st .l{font-size:32px;color:var(--mut);margin-top:18px;line-height:1.35}
  .st.good .b{color:var(--green)} .st.bad .b{color:var(--orange)} .st.blue .b{color:var(--blue)}
  /* value index cards */
  .vi{flex:1;border:2px solid var(--ln);border-radius:24px;background:var(--panel);padding:28px 36px}
  .vi h3{font:700 42px 'IBM Plex Sans',sans-serif;margin:0 0 20px}
  .vi .ln{display:grid;grid-template-columns:140px 1fr 170px;gap:20px;align-items:center;font-size:30px;margin-bottom:18px}
  .vi .ln .tr{height:30px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
  .vi .ln .tr i{display:block;height:100%;border-radius:99px}
  .vi .ix{margin-top:14px;font:700 70px 'IBM Plex Mono',monospace}
  .vi .ix small{display:block;font:600 24px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
  /* FAST */

  .fb{position:absolute;width:172px;height:100px;border-radius:14px;border:2px solid var(--ln);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:600 25px 'IBM Plex Sans',sans-serif;line-height:1.15}
  .fb small{font:500 17px 'IBM Plex Mono',monospace;color:var(--mut);margin-top:6px}
  .fb.basic{border-color:var(--blue);background:#10204a}
  .fb.out{border-style:dashed;color:var(--mut)}
  .fb.ok{border-color:var(--green)} .fb.warm{border-color:var(--amber)} .fb.hot{border-color:var(--orange);background:#2a160f}
  .fl{position:absolute;height:3px;background:rgba(160,190,255,.6)}
  .fa{position:absolute;font:700 30px 'IBM Plex Mono',monospace;color:var(--blue);letter-spacing:.1em}
  /* scores */
  .dots{display:flex;gap:10px}
  .dots s{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08)}
  .dots s.f{background:var(--blue)}
  /* waterfall */
  .wf{position:relative;height:520px}
  .wf .c{position:absolute;bottom:60px;border-radius:8px}
  .wf .lb{position:absolute;bottom:10px;font-size:25px;color:var(--mut);text-align:center;white-space:nowrap}
  .wf .vv{position:absolute;font:700 30px 'IBM Plex Mono',monospace;text-align:center;white-space:nowrap}
  .wf .tg{position:absolute;left:0;right:0;border-top:3px dashed var(--green)}
  .wf .tg span{position:absolute;right:0;top:-44px;font:600 26px 'IBM Plex Sans',sans-serif;color:var(--green)}
  /* end */
  .end{position:absolute;left:0;right:0;top:300px;text-align:center}
  .end h1{font:800 104px 'IBM Plex Sans',sans-serif;letter-spacing:-.03em;margin:0 0 30px;line-height:1.05}
  .end h1 span{color:var(--blue)}
  .end p{font:500 40px 'Inter',sans-serif;color:var(--mut);margin:0}
  .end p.copy{margin-top:48px;font:500 26px 'Inter',sans-serif;color:var(--mut);opacity:.85}
  .end .url{margin-top:56px;display:inline-block;padding:20px 40px;border-radius:16px;background:var(--blue2);font:700 40px 'IBM Plex Sans',sans-serif;color:#fff}
  /* function analysis series */
  .bigs{position:absolute;left:160px;right:160px;top:240px;text-align:center}
  .bigs h2{font:800 92px 'IBM Plex Sans',sans-serif;letter-spacing:-.03em;line-height:1.08;margin:0 0 26px}
  .bigs h2 em{font-style:normal;color:var(--blue)}
  .bigs .bp,.tryq .bp{font-size:38px;line-height:1.4;color:var(--mut);margin:0 auto;max-width:1300px}
  .tryq{position:absolute;left:160px;right:160px;top:220px;text-align:center}
  .tryq .kt{color:var(--green)}
  .tryq h2{font:800 78px 'IBM Plex Sans',sans-serif;letter-spacing:-.02em;line-height:1.1;margin:0 0 22px}
  .tryq .ring{position:relative;width:150px;height:150px;margin:40px auto 0}
  .tryq .ring svg{width:150px;height:150px;transform:rotate(-90deg)}
  .tryq .r0{fill:none;stroke:rgba(255,255,255,.1);stroke-width:10}
  .tryq .r1{fill:none;stroke:var(--green);stroke-width:10;stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:0}
  .tryq .ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 64px 'IBM Plex Mono',monospace}
  table.t td.strike{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--orange)}
  table.t td.bold{font-weight:700;color:#fff}
  .spl{display:grid;gap:24px}
  .spl-h{display:flex;justify-content:space-between;font-size:32px;margin-bottom:10px}.spl-h span{font-family:'IBM Plex Mono',monospace}
  .spl-bar{position:relative;display:flex;height:96px;border-radius:14px;overflow:hidden}
  .spl-bar .whole{position:absolute;inset:0;background:#3b4560;z-index:1}
  .spl-bar .pc{display:flex;align-items:center;justify-content:center;text-align:center;min-width:150px;opacity:0}
  .spl-bar .pc em{font:600 22px 'Inter',sans-serif;font-style:normal;color:#fff;line-height:1.2}
  .par svg{width:1680px;height:560px;overflow:visible}
  .par .pg{stroke:rgba(255,255,255,.08)}.par .pa{font:500 20px 'IBM Plex Mono',monospace;fill:var(--mut);text-anchor:end}
  .par .pb{fill:#5a7fc4}.par .pb.top{fill:var(--orange)}.par .pb.hl{fill:#ffb27a}
  .par .pn{font:500 17px 'Inter',sans-serif;fill:var(--mut);text-anchor:end}
  .par .pv{font:600 16px 'IBM Plex Mono',monospace;fill:#fff;text-anchor:middle}
  .par .pz{fill:rgba(255,122,61,.1)}.par .pzt{font:700 26px 'IBM Plex Sans',sans-serif;fill:var(--orange);text-anchor:start}
  .par .pl{fill:none;stroke:#fff;stroke-width:3}.par .pd{fill:#fff}
  .qz-h{font-size:64px!important;line-height:1.12;max-width:1600px}
  .qz{display:grid;gap:22px;margin-top:40px;width:1400px}
  .qo{display:grid;grid-template-columns:84px 1fr auto;align-items:center;gap:30px;padding:22px 34px;border-radius:20px;border:2px solid var(--ln);background:var(--panel);font:600 44px 'IBM Plex Sans',sans-serif}
  .qo i{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:var(--blue2);font:700 38px 'IBM Plex Sans',sans-serif;font-style:normal;color:#fff}
  .qo b{font:700 44px 'IBM Plex Mono',monospace;color:var(--amber)}
  .vg2{display:grid;gap:7px}
  .vr{display:grid;grid-template-columns:330px 1fr 120px;gap:24px;align-items:center;font-size:30px}
  .vb{display:grid;gap:3px}.vb i{display:block;height:19px;border-radius:99px;font:600 17px 'IBM Plex Mono',monospace;font-style:normal;color:#04130b;text-align:right;padding-right:8px;line-height:22px;min-width:4px}
  .vb .vi1{background:var(--green)}.vb .vi2{background:#5a7fc4;color:#fff}
  .vx{font:700 30px 'IBM Plex Mono',monospace;text-align:right}.vr.hot .vx{color:var(--orange)}

  .fb2 .bx .sb{font:500 12.5px 'IBM Plex Mono',monospace;fill:var(--mut)}
  .fb2 .k-basic rect{stroke:var(--blue);stroke-width:3.5;fill:#10204a}
  .fb2 .k-higher rect,.fb2 .k-assumed rect{stroke-dasharray:6 5;fill:transparent}

  .fb2 .k-all rect{stroke:#22a39a}.fb2 .k-one rect{stroke:#9b6cf0}.fb2 .k-user rect{stroke:#7b8db0}.fb2 .k-esteem rect{stroke:#e06aa8}.fb2 .k-second rect{stroke:var(--amber)}.fb2 .k-when rect{stroke:#7c8db5}
  .fb2 .bx.ok rect{stroke:var(--green)}.fb2 .bx.warm rect{stroke:var(--amber)}.fb2 .bx.hot rect{stroke:var(--orange);fill:#2a160f}

  .fb2 .rl text{font:700 13px 'IBM Plex Mono',monospace;fill:var(--mut);letter-spacing:.08em}

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const card = $("#card"), panel = $("#panel"), chip = $("#chip"), cap = $("#cap"), viewer = $("#pjViewer"), tag = $("#tag");
let capAt = 0;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeInOut = (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const lerp = (a, b, p) => a + (b - a) * p;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

      let cum = 0, pts = [], s = "";
      [0, 25, 50, 75, 100].forEach((p) => (s += `<line x1="${L}" x2="${W - R}" y1="${yc(p)}" y2="${yc(p)}" class="pg"/><text x="${L - 10}" y="${yc(p) + 7}" class="pa">${p}%</text>`));
      const zq = easeOut(seg(t, zoneAt, zoneAt + 0.8));
      s += `<rect x="${L}" y="${T}" width="${d.top * bw * zq}" height="${H - T}" class="pz"/><text x="${L}" y="${T - 12}" class="pzt" style="opacity:${zq}">${esc(d.zone)}</text>`;
      d.items.forEach((f, i) => { cum += f.cost; pts.push([L + i * bw + bw / 2, yc(cum / d.total * 100)]);
        const q = easeOut(seg(t, 0.8 + i * per, 0.8 + i * per + 0.5)), h = (H - yb(f.cost)) * q, top = i < d.top && zq > 0;
        s += `<rect x="${L + i * bw + 4}" y="${H - h}" width="${bw - 8}" height="${h}" rx="3" class="pb${top ? " top" : ""}${(d.hl || []).includes(f.id) ? " hl" : ""}"/>`;
        s += `<text transform="translate(${L + i * bw + bw / 2 + 6},${H + 14}) rotate(-55)" class="pn" style="opacity:${q}">${esc(f.fn)}</text>`;
        if (i < Math.min(d.top, 6)) s += `<text x="${L + i * bw + bw / 2}" y="${H - h - 8}" class="pv" style="opacity:${seg(t, zoneAt, zoneAt + 0.6)}">£${f.cost.toFixed(2)}</text>`; });
      const lq = seg(t, lineAt, lineAt + 1.0), k = Math.max(1, Math.round(lq * n));
      if (lq > 0) s += `<polyline points="${pts.slice(0, k).map((p) => p.join(",")).join(" ")}" class="pl"/>` + pts.slice(0, k).map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="4" class="pd"/>`).join("");
      svg.innerHTML = s; },
  },
  // value graph: importance to the customer against share of the cost
  vg2: {
    html: (d) => `<div class="k"><p class="kt">${esc(d.k)}</p><h2 class="kh">${esc(d.h)}</h2><div class="vg2">${d.rows.map((r) =>
      `<div class="vr ${r.cost / r.imp >= 2 ? "hot" : ""}"><span class="vn">${esc(r.fn)}</span><span class="vb"><i class="vi1"></i><i class="vi2"></i></span><span class="vx">${(r.cost / r.imp).toFixed(1)}×</span></div>`).join("")}</div>
      <p class="vk"><span class="k1">importance to the school</span><span class="k2">share of the cost</span></p></div>`,
    frame: (t) => { const d = S, mx = Math.max(...d.rows.flatMap((r) => [r.imp, r.cost])); rise($(".k .kt"), seg(t, 0, 0.5)); rise($(".k .kh"), seg(t, 0.15, 0.7)); rise($(".vk"), seg(t, 0.4, 0.8));
      const per = (DUR * 0.55) / d.rows.length;
      document.querySelectorAll(".vr").forEach((e, i) => { const r = d.rows[i], a = 0.8 + i * per; rise(e, seg(t, a, a + 0.3), 10);
        const [b1, b2] = e.querySelectorAll("i"), q1 = easeOut(seg(t, a + 0.1, a + 0.8)), q2 = easeOut(seg(t, a + 0.4, a + 1.1));
        b1.style.width = q1 * r.imp / mx * 100 + "%"; b1.textContent = q1 > 0.9 ? r.imp.toFixed(0) + "%" : ""; b2.style.width = q2 * r.cost / mx * 100 + "%"; b2.textContent = q2 > 0.9 ? r.cost.toFixed(0) + "%" : "";
        e.querySelector(".vx").style.opacity = seg(t, a + 1.0, a + 1.4); }); },
  },
  // a challenge for the viewer: a question and its options
  quiz: {
    html: (d) => `<div class="k"><p class="kt">${esc(d.k)}</p><h2 class="kh qz-h">${esc(d.h)}</h2><div class="qz">${d.opts.map((o) =>
      `<div class="qo"><i>${esc(o.l)}</i><span>${esc(o.t)}</span>${o.v ? `<b>${esc(o.v)}</b>` : ""}</div>`).join("")}</div></div>`,
    frame: (t) => { const d = S; rise($(".k .kt"), seg(t, 0, 0.5)); rise($(".k .kh"), seg(t, 0.15, 0.8));
      const at = d.at || d.opts.map((_, i) => 1.0 + i * 0.6);
      document.querySelectorAll(".qo").forEach((e, i) => rise(e, seg(t, at[i], at[i] + 0.45), 24)); },
  },
  // the FAST diagram, built up layer by layer
  fastb: {
    html: () => `<div class="fb2"><svg viewBox="10 0 1545 716"></svg></div>`,
    frame: (t) => { const d = S, D = window.VH_PROJ, FNS = Object.fromEntries(D.funcs.map((f) => [f.id, f]));
      const ROWY = { D: 34, A: 118, B: 194, P: 300, W1: 396, W2: 470, W3: 544, W4: 618 }, CW = 140, BW = 124, BH = 58, X0 = 20, bx = (f) => ({ x: X0 + f.col * CW, y: ROWY[f.row] });
      // when each box appears: base ones are already there; added ones appear in turn
      const add = d.add || [], span = Math.max(0.5, DUR * 0.75 - 0.6), at = {};
      (d.base || []).forEach((id) => (at[id] = -1)); add.forEach((id, i) => (at[id] = 0.6 + i * span / Math.max(1, add.length)));
      const vis = (id) => (at[id] == null ? 0 : easeOut(seg(t, at[id], at[id] + 0.5)));
      const on = (k) => (d.flags || []).includes(k) || (d.addFlags || []).includes(k);
      const fq = (k) => ((d.flags || []).includes(k) ? 1 : (d.addFlags || []).includes(k) ? easeOut(seg(t, 0.6, 1.3)) : 0);
      let s = "";
      if (on("axis")) s += `<g style="opacity:${fq("axis")}" class="ax"><line x1="200" y1="14" x2="700" y2="14"/><path d="M700 8 L714 14 L700 20Z"/><text x="722" y="20">HOW?</text><path d="M200 24 L186 30 L200 36Z"/><line x1="200" y1="30" x2="700" y2="30"/><text x="178" y="36" style="text-anchor:end">WHY?</text></g>`;
      if (on("scope")) { const q = fq("scope"), x1 = X0 + CW - 8, x2 = X0 + 10 * CW - 8; s += `<g style="opacity:${q}" class="sc"><line x1="${x1}" y1="100" x2="${x1}" y2="${100 + 590 * q}"/><line x1="${x2}" y1="100" x2="${x2}" y2="${100 + 590 * q}"/><text x="${x1}" y="708">scope</text><text x="${x2}" y="708">scope</text></g>`; }
      if (on("objective")) s += `<g style="opacity:${fq("objective")}" class="cr ob"><rect x="${X0}" y="48" width="${5 * CW + BW}" height="40" rx="8"/><text x="${X0 + 12}" y="73"><tspan class="crh">STUDY OBJECTIVE </tspan>${esc(D.objective)}</text></g>`;
      if (on("criteria")) s += `<g style="opacity:${fq("criteria")}" class="cr"><rect x="${X0 + 6 * CW}" y="4" width="${4 * CW + BW}" height="96" rx="8"/><text class="crh" x="${X0 + 6 * CW + 12}" y="22">DESIGN CRITERIA (requirements, not functions)</text>${D.criteria.map((c, i) => `<text x="${X0 + 6 * CW + 12 + (i % 3) * 222}" y="${42 + Math.floor(i / 3) * 20}">${esc(c)}</text>`).join("")}</g>`;
      // row labels, shown with the first box of each row
      [["ALL THE TIME", "AND ESTEEM", "encl", X0, ROWY.A + 22], ["USER AND", "ONE TIME", "cmd", X0, ROWY.B + 22], ["CRITICAL PATH", "", "mag", X0 + 2 * CW, ROWY.P - 12], ["WHEN, OR", "CAUSED BY", "sig", X0, ROWY.W3 + 22]]
        .forEach(([a, b, id, x, y]) => { const q = vis(id); if (q) s += `<g class="rl" style="opacity:${q * 0.9}"><text x="${x}" y="${y}">${a}</text>${b ? `<text x="${x}" y="${y + 17}">${b}</text>` : ""}</g>`; });
      const path = D.funcs.filter((f) => f.row === "P").sort((a, b) => a.col - b.col);
      path.forEach((f, i) => { if (!i) return; const q = Math.min(vis(f.id), vis(path[i - 1].id)); if (!q) return; const a = bx(path[i - 1]), b = bx(f);
        s += `<line class="ln${f.kind === "assumed" ? " dash" : ""}" style="opacity:${q}" x1="${a.x + BW}" y1="${a.y + BH / 2}" x2="${b.x}" y2="${b.y + BH / 2}"/>`; });
      D.flinks.forEach(([from, to, type]) => { const q = Math.min(vis(from), vis(to)); if (!q) return; const a = bx(FNS[from]), b = bx(FNS[to]);
        const cls = `ln ${type}`, st = `opacity:${q}`;
        if (a.x === b.x) s += `<line class="${cls}" style="${st}" x1="${a.x + BW / 2}" y1="${a.y + BH}" x2="${b.x + BW / 2}" y2="${b.y}"/>`;
        else if (a.y === b.y) s += `<line class="${cls}" style="${st}" x1="${a.x + BW}" y1="${a.y + BH / 2}" x2="${b.x}" y2="${b.y + BH / 2}"/>`;
        else s += `<path class="${cls}" style="${st}" d="M${a.x + BW / 2} ${a.y + BH} L${a.x + BW / 2} ${b.y + BH / 2} L${b.x} ${b.y + BH / 2}" fill="none"/>`; });
      const hl = d.hl || null, pulse = hl ? 0.5 + 0.5 * Math.sin(t * 4) : 0;
      D.funcs.forEach((f) => { const q = vis(f.id); if (!q) return; const { x, y } = bx(f), w = f.fn.split(" "), c = d.cost && d.costs ? d.costs[f.id] : null;
        const sub = c ? `${gbp(c[0])} · VI ${c[1] > 10 ? ">10" : c[1].toFixed(2)}` : f.kind === "basic" ? "basic function" : f.kind === "higher" ? "higher-order" : f.kind === "assumed" ? "input" : f.kind === "unwanted" ? "unwanted" : "";
        const vic = c ? (c[1] >= 2 ? " hot" : c[1] >= 1.25 ? " warm" : " ok") : "", isH = hl && hl.includes(f.id), dim = hl && !isH ? 0.32 : 1;
        s += `<g class="bx k-${f.kind}${vic}${isH ? " hl" : ""}" style="opacity:${q * dim};transform-origin:${x + BW / 2}px ${y + BH / 2}px;transform:scale(${0.85 + 0.15 * q})">
          ${isH ? `<rect x="${x - 5}" y="${y - 5}" width="${BW + 10}" height="${BH + 10}" rx="11" class="glow" style="opacity:${0.4 + 0.6 * pulse}"/>` : ""}
          <rect x="${x}" y="${y}" width="${BW}" height="${BH}" rx="8"/><text x="${x + BW / 2}" y="${y + (sub ? 20 : 25)}">${esc(w[0])}</text><text x="${x + BW / 2}" y="${y + (sub ? 36 : 42)}">${esc(w.slice(1).join(" "))}</text>${sub ? `<text class="sb" x="${x + BW / 2}" y="${y + 51}">${sub}</text>` : ""}</g>`; });
      if (d.label) s += `<text class="lab" x="${d.label[1]}" y="${d.label[2]}" style="opacity:${seg(t, 0.4, 1)}">${esc(d.label[0])}</text>`;
      $(".fb2 svg").innerHTML = s; },
  },
  end: {
    html: (d) => `<div class="end"><h1>${d.h}</h1><p>${esc(d.p)}</p><div class="url">${esc(d.url)}</div>${d.copy ? `<p class="copy">${esc(d.copy)}</p>` : ""}</div>`,
    frame: (t) => { rise($(".end h1"), seg(t, 0.2, 1.0), 40); rise($(".end p"), seg(t, 0.8, 1.4)); rise($(".end .url"), seg(t, 1.3, 1.9)); rise($(".end .copy"), seg(t, 1.8, 2.4)); },
  },
};

// called once per scene
window.setup = function (scene, meta) {
  S = scene; DUR = meta.dur;
  chip.innerHTML = meta.step ? `<span class="n">${meta.step}</span><span>Step ${meta.step} of 6 · <b>${esc(meta.stepName)}</b></span>` : `<span class="n">${meta.badge || "▶"}</span><span>VH-3600 case study · <b>${esc(meta.name)}</b></span>`;
  cap.innerHTML = scene.vo ? `<div>${esc(scene.chunks ? scene.chunks[0].text : scene.vo)}</div>` : ""; capAt = 0;
  const is3d = scene.kind === "three";
  tag.innerHTML = is3d && scene.tag ? scene.tag : ""; tag.dataset.i = ""; tag.style.opacity = 0;
  card.classList.toggle("on", !is3d); viewer.style.visibility = is3d ? "visible" : "hidden";
  if (!is3d) { card.innerHTML = K[scene.kind].html(scene); }
  panel.classList.toggle("on", !!(is3d && scene.panel));
  if (is3d && scene.panel) {
    const p = scene.panel;
    panel.innerHTML = `<small>${esc(p.k)}</small>${p.big ? `<div class="big">${p.big}</div>` : ""}${p.p ? `<p>${esc(p.p)}</p>` : ""}${p.list ? `<ul>${p.list.map(([a, b]) => `<li><span>${esc(a)}</span><b>${esc(b)}</b></li>`).join("")}</ul>` : ""}`;
  }
  // the model sits left of the panel when there is one
  const w = is3d && scene.panel ? 1260 : 1920;
  viewer.style.width = w + "px";
  return true;
};
window.frame = function (t) {
  if (S.kind === "three") three(t); else K[S.kind].frame(t);
  // the subtitle fades in with the line and out at the end of the scene
  let o = clamp(Math.min(seg(t, 0.15, 0.45), seg(DUR - t, 0, 0.25)));
  if (S.chunks && S.chunks.length > 1) {   // a sentence or two at a time, with a short dip between them
    let i = 0; S.chunks.forEach((c, j) => { if (t >= c.at - 0.1) i = j; });
    if (i !== capAt) { capAt = i; cap.firstChild.textContent = S.chunks[i].text; }
    const nx = S.chunks[i + 1]; if (i > 0) o = Math.min(o, seg(t, S.chunks[i].at - 0.1, S.chunks[i].at + 0.1)); if (nx) o = Math.min(o, seg(nx.at - 0.1 - t, 0, 0.12));
  }
  cap.style.opacity = o;
  chip.style.opacity = 1;
};
window.ready = () => !!window.VHProjector;
</script>
